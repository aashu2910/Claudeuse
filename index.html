<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <meta name="description" content="Personal portfolio built with Portfy Templates by EasyLife Solutions" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" id="brand"></a>
    <nav aria-label="Main">
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#experience">Experience</a>
      <a href="#contact">Contact</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">◐</button>
  </header>

  <main id="top">
    <section class="hero">
      <p class="eyebrow" id="role"></p>
      <h1 id="name"></h1>
      <p class="tagline" id="tagline"></p>
      <div class="hero-actions">
        <a class="btn primary" href="#contact">Get in touch</a>
        <a class="btn" id="resumeLink" href="#" target="_blank" rel="noopener">Download resume</a>
      </div>
    </section>

    <section id="about" class="section">
      <h2>About</h2>
      <p id="about-text"></p>
    </section>

    <section id="skills" class="section">
      <h2>Skills</h2>
      <ul class="chips" id="skills-list"></ul>
    </section>

    <section id="projects" class="section">
      <h2>Projects</h2>
      <div class="grid" id="projects-list"></div>
    </section>

    <section id="experience" class="section">
      <h2>Experience</h2>
      <ol class="timeline" id="experience-list"></ol>
    </section>

    <section id="contact" class="section">
      <h2>Contact</h2>
      <p>Have an opportunity or a question? Send a message.</p>
      <form class="contact-form" id="contactForm">
        <label>Name <input name="name" required /></label>
        <label>Email <input name="email" type="email" required /></label>
        <label>Message <textarea name="message" rows="4" required></textarea></label>
        <button class="btn primary" type="submit">Send via email</button>
      </form>
      <ul class="links" id="social-links"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>Built with <a href="https://portfolio.easylife.solutions" target="_blank" rel="noopener">Portfy</a> · Open source under the MIT License</p>
  </footer>

  <script src="profile.js"></script>
  <script src="app.js"></script>
</body>
</html>
